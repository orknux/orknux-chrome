<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Orknux</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <h1>Orknux</h1>
    <span id="state" class="state off">Not connected</span>
  </header>

  <form id="settings">
    <label>Pairing link or server
      <!-- text, not url: a pasted pairing link is split before anything checks it. -->
      <input id="server" type="text" placeholder="https://orknux.example.com/pair/K7P-4QX" autocomplete="off" required>
    </label>
    <label>Access token, if not a pairing link
      <input id="token" type="password" placeholder="orkx_… (or the code alone)" autocomplete="off">
    </label>
    <p class="hint">Paste the pairing link from Orknux (or server + token): Preferences › Connected clients › Connect a client. Your agents act in this browser as you, while this panel is open.</p>
    <div class="buttons">
      <button id="connect" type="submit">Connect</button>
      <button id="disconnect" type="button" hidden>Disconnect</button>
    </div>
  </form>

  <p id="message" class="message" hidden></p>

  <section>
    <h2>What your agents did</h2>
    <ol id="log"></ol>
  </section>

  <script type="module" src="panel.js"></script>
</body>
</html>
